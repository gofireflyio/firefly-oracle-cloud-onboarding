# Title shown in Application Information tab.
title: Firefly OCI Integration
# Sub Title shown in Application Information tab.
description: Setting up infrastructure for Firefly cloud governance integration with Oracle Cloud Infrastructure
schemaVersion: 1.1.0
version: 1.0
locale: en

variableGroups:
  - title: "Tenancy Configuration"
    variables:
      - ${tenancy_ocid}
      - ${region}
      - ${compartment_ocid}
      - ${current_user_ocid}
      - ${domain_id}
    visible: false
  - title: "Firefly Authentication"
    variables:
      - ${firefly_endpoint}
      - ${firefly_access_key}
      - ${firefly_secret_key}
  - title: "Resource Configuration"
    variables:
      - ${prefix}
      - ${suffix}
      - ${tags}
  - title: "Service Connector Options"
    variables:
      - ${managed_service_connector}
      - ${existing_dynamic_group_id}
      - ${dynamic_group_name}
  - title: "Advanced Options"
    variables:
      - ${existing_user_id}
      - ${existing_group_id}
      - ${firefly_auth_policy}
      - ${event_driven_regions}
      - ${is_prod}
      - ${integrationSessionId}
      - ${skip_integration_request}

variables:
  # Firefly Authentication
  firefly_endpoint:
    title: Firefly API Endpoint
    type: string
    description: |
      The Firefly API endpoint URL. Use the default unless instructed otherwise by Firefly support.
    required: false
    default: "https://prodapi.firefly.ai/api"

  firefly_access_key:
    title: Firefly Access Key
    type: string
    description: |
      Your Firefly authentication access key. This can be found in your Firefly account settings under API Keys.
    required: true
    sensitive: true
    password: true

  firefly_secret_key:
    title: Firefly Secret Key
    type: string
    description: |
      Your Firefly authentication secret key. This can be found in your Firefly account settings under API Keys.
    required: true
    sensitive: true
    password: true
    confirmation: true

  # Resource Configuration
  compartment_ocid:
    title: Compartment
    description: |
      OCID of the compartment to use for Firefly resources. If null, a compartment named 'Firefly' will be created in the tenancy.
    type: oci:identity:compartment:id
    required: false
    default: null

  domain_id:
    title: Identity Domain
    type: string
    description: |
      OCID of the identity domain to use for user and group management. If not provided, the default domain will be used.
    required: false
    default: ""

  prefix:
    title: Resource Name Prefix
    type: string
    description: |
      Optional prefix to add to all created resource names. Useful for organizing resources or avoiding naming conflicts.
    required: false
    default: ""

  suffix:
    title: Resource Name Suffix
    type: string
    description: |
      Optional suffix to add to all created resource names. Useful for organizing resources or avoiding naming conflicts.
    required: false
    default: ""

  tags:
    title: Resource Tags
    type: text
    multiline: true
    description: |
      Optional tags to apply to all created resources. Enter in key=value format, one per line.
      Example:
      Environment=Production
      Project=Firefly
      Owner=CloudTeam
    required: false
    default: ""

  # Service Connector Configuration
  managed_service_connector:
    title: Let Firefly Manage Service Connector
    type: boolean
    description: |
      Whether to let Firefly manage the service connector for log streaming.
    required: false
    default: true

  existing_dynamic_group_id:
    title: Existing Dynamic Group ID
    type: string
    description: |
      OCID of an existing dynamic group to use for service connector permissions.
      Leave blank to create a new dynamic group automatically.
    required: false
    default: ""

  dynamic_group_name:
    title: Dynamic Group Name
    type: string
    description: |
      Name for the dynamic group that will be created (if not using an existing one).
    required: false
    default: "firefly-dynamic-group"

  # Advanced Options
  existing_user_id:
    title: Existing User ID
    type: string
    description: |
      OCID of an existing OCI user to use for Firefly authentication.
      <strong>(Recommended): Leave blank to create a new user automatically.</strong>
    required: false
    default: null

  existing_group_id:
    title: Existing Group ID
    type: string
    description: |
      OCID of an existing OCI group to use for Firefly permissions.
      <strong>(Recommended): Leave blank to create a new group automatically.</strong>
    required: false
    default: null

  firefly_auth_policy:
    title: Firefly Auth Policy Name
    type: string
    description: |
      Name for the IAM policy that will grant Firefly the necessary permissions.
    required: false
    default: "firefly-auth-policy"

  event_driven_regions:
    title: Event-Driven Integration Regions
    type: string
    description: |
      OCI regions for event-driven integration. Comma-separated list of region names (e.g., us-phoenix-1,us-ashburn-1).
      Leave blank to use all subscribed regions.
    required: false
    default: ""

  is_prod:
    title: Production Environment
    type: boolean
    description: |
      Whether this is a production environment.
    required: false
    default: true

  integrationSessionId:
    title: Integration Session ID
    type: string
    description: |
      Integration session ID for tracking purposes.
    required: false
    default: ""

  skip_integration_request:
    title: Skip Integration Request
    type: boolean
    description: |
      Skip the HTTP integration request (useful for destroy operations).
    required: false
    default: false

  # Hidden variables (automatically populated by ORM)
  tenancy_ocid:
    title: Tenancy OCID
    type: string
    description: "The OCID of the tenancy"
    required: true

  current_user_ocid:
    title: Current User OCID
    type: string
    description: "The OCID of the current user"
    required: false
    default: ""

  region:
    title: Region
    type: string
    description: "OCI Region for default provider"
    required: true

outputs:
  firefly_integration_status:
    title: "Integration Status"
    description: "Status of the Firefly OCI integration setup"
    type: string

  created_resources:
    title: "Created Resources"
    description: "Summary of resources created for Firefly integration"
    type: string
